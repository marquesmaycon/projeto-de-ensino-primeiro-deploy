<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu Nome | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chivo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark">
  <div class="container">
    <header>
      <img class="avatar" src="https://github.com/marquesmaycon.png" alt="Foto de perfil de Seu Nome">
      <h1>Maycon Marques</h1>
      <p class="usuario">@marquesmaycon</p>
      <p class="bio">Estudante de tecnologia publicando o primeiro site na internet.</p>
    </header>

    <main>
      <a class="principal" href="https://pages.github.com" target="_blank" rel="noopener noreferrer">Ver portfólio</a>

      <ul class="links">
        <li>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">
            GitHub <span class="endereco">github.com/seuusuario</span>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
            LinkedIn <span class="endereco">linkedin.com/in/seuusuario</span>
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
            Instagram <span class="endereco">instagram.com/seuusuario</span>
          </a>
        </li>
      </ul>
    </main>

    <footer class="rodape">
      <p>Publicado com GitHub Pages no Primeiro Deploy.</p>
      <button class="botao-tema" type="button">Trocar tema</button>
    </footer>
  </div>

  <script src="./script.js"></script>
</body>
</html>
